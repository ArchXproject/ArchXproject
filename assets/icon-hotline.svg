<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges"><style>.bob{animation:bob 1s steps(1) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}.fa{animation:fa 1s steps(1) infinite}@keyframes fa{0%{opacity:1}50%{opacity:0}}.fb{opacity:0;animation:fb 1s steps(1) infinite}@keyframes fb{0%{opacity:0}50%{opacity:1}}.mv{animation:mv 2s steps(1) infinite}@keyframes mv{0%{transform:translate(0,0)}50%{transform:translate(2px,1px)}}</style><g class="bob"><rect x="4" y="1" width="8" height="1" fill="#bae6fd"/><rect x="3" y="2" width="1" height="1" fill="#bae6fd"/><rect x="12" y="2" width="1" height="1" fill="#bae6fd"/><rect x="2" y="3" width="1" height="4" fill="#bae6fd"/><rect x="13" y="3" width="1" height="4" fill="#bae6fd"/><rect x="1" y="7" width="3" height="5" fill="#0a1030"/><rect x="2" y="8" width="2" height="3" fill="#1d63d8"/><rect x="12" y="7" width="3" height="5" fill="#0a1030"/><rect x="12" y="8" width="2" height="3" fill="#1d63d8"/><rect x="13" y="12" width="1" height="2" fill="#0a1030"/><rect x="10" y="14" width="4" height="1" fill="#0a1030"/><rect x="8" y="13" width="2" height="2" fill="#ffffff"/></g><rect x="0" y="4" width="1" height="2" fill="#fde047" class="bl"/><rect x="15" y="4" width="1" height="2" fill="#fde047" class="bl" style="animation-delay:0.5s"/><rect x="0" y="9" width="1" height="1" fill="#38bdf8" class="bl" style="animation-delay:0.5s"/></svg>