<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges"><style>.bob{animation:bob 1s steps(1) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}.fa{animation:fa 1s steps(1) infinite}@keyframes fa{0%{opacity:1}50%{opacity:0}}.fb{opacity:0;animation:fb 1s steps(1) infinite}@keyframes fb{0%{opacity:0}50%{opacity:1}}.mv{animation:mv 2s steps(1) infinite}@keyframes mv{0%{transform:translate(0,0)}50%{transform:translate(2px,1px)}}</style><rect x="1" y="14" width="14" height="1" fill="#0a1030"/><g class="fa"><rect x="2" y="8" width="3" height="6" fill="#38bdf8"/></g><g class="fb"><rect x="2" y="5" width="3" height="9" fill="#38bdf8"/></g><g class="fa"><rect x="6" y="3" width="3" height="11" fill="#1d63d8"/></g><g class="fb"><rect x="6" y="7" width="3" height="7" fill="#1d63d8"/></g><g class="fa"><rect x="10" y="6" width="3" height="8" fill="#bae6fd"/></g><g class="fb"><rect x="10" y="2" width="3" height="12" fill="#bae6fd"/></g><rect x="14" y="0" width="1" height="1" fill="#ffffff" class="bl"/></svg>