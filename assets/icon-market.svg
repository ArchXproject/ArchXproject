<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges"><style>.bob{animation:bob 1s steps(1) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}.fa{animation:fa 1s steps(1) infinite}@keyframes fa{0%{opacity:1}50%{opacity:0}}.fb{opacity:0;animation:fb 1s steps(1) infinite}@keyframes fb{0%{opacity:0}50%{opacity:1}}.mv{animation:mv 2s steps(1) infinite}@keyframes mv{0%{transform:translate(0,0)}50%{transform:translate(2px,1px)}}</style><g class="bob"><rect x="5" y="2" width="6" height="1" fill="#0a1030"/><rect x="5" y="2" width="1" height="4" fill="#0a1030"/><rect x="10" y="2" width="1" height="4" fill="#0a1030"/><rect x="2" y="5" width="12" height="11" fill="#0a1030"/><rect x="3" y="6" width="10" height="9" fill="#1d63d8"/><rect x="3" y="6" width="10" height="1" fill="#38bdf8"/><rect x="5" y="9" width="1" height="2" fill="#ffffff"/><rect x="10" y="9" width="1" height="2" fill="#ffffff"/><rect x="5" y="11" width="1" height="1" fill="#ffffff"/><rect x="6" y="12" width="4" height="1" fill="#ffffff"/><rect x="10" y="11" width="1" height="1" fill="#ffffff"/></g><rect x="13" y="0" width="2" height="2" fill="#fde047" class="bl"/><rect x="0" y="2" width="1" height="1" fill="#fde047" class="bl" style="animation-delay:0.5s"/></svg>