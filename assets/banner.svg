<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-label="ArchXproject banner">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040a1c"/><stop offset=".55" stop-color="#0b2a6b"/><stop offset="1" stop-color="#1d63d8"/></linearGradient>
<linearGradient id="tg" x1="0" x2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#ffffff"/><stop offset=".4" stop-color="#38bdf8"/><stop offset=".5" stop-color="#ffffff"/><stop offset="1" stop-color="#ffffff"/></linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#38bdf8" stroke-opacity=".13"/></pattern>
<filter id="glow" x="-20%" y="-40%" width="140%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="c"><rect width="1000" height="320" rx="18"/></clipPath>
</defs>
<style>
text{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
.p{opacity:0;animation:rise 9s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}10%{opacity:.85}90%{opacity:.85}100%{transform:translateY(-360px);opacity:0}}
.gl{animation:drop 7s ease-in-out infinite}
@keyframes drop{0%{transform:translateY(-100px);opacity:0}8%{opacity:1}18%{transform:translateY(0)}22%{transform:translateY(-8px)}27%,90%{transform:translateY(0);opacity:1}97%,100%{transform:translateY(-100px);opacity:0}}
.sub{opacity:0;animation:show 9s ease-in-out infinite}
@keyframes show{0%{opacity:0;transform:translateY(10px)}6%,30%{opacity:1;transform:translateY(0)}36%,100%{opacity:0;transform:translateY(-6px)}}
.w1{animation:wave 9s linear infinite}
.w2{animation:wave 5.5s linear infinite}
@keyframes wave{to{transform:translateX(-500px)}}
.sw{animation:sweep 6s ease-in-out infinite}
@keyframes sweep{0%{transform:translateX(-300px) skewX(-20deg)}60%,100%{transform:translateX(1300px) skewX(-20deg)}}
.tt{animation:pulse 3s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.78}}
.tw{animation:tw 1.2s steps(2) infinite}
@keyframes tw{50%{opacity:0}}
</style>
<g clip-path="url(#c)">
<rect width="1000" height="320" fill="url(#bg)"/>
<rect width="1000" height="320" fill="url(#grid)"/>
<rect x="351" y="330" width="6" height="6" fill="#38bdf8" class="p" style="animation-duration:8.4s;animation-delay:-0.6s"/>
