<rect x="597" y="330" width="5" height="5" fill="#ffffff" class="p" style="animation-duration:9.7s;animation-delay:-6.0s"/>
<rect x="564" y="330" width="10" height="10" fill="#22d3ee" class="p" style="animation-duration:10.7s;animation-delay:-5.6s"/>
<rect x="965" y="330" width="10" height="10" fill="#38bdf8" class="p" style="animation-duration:8.2s;animation-delay:-3.0s"/>
<rect x="204" y="330" width="6" height="6" fill="#93c5fd" class="p" style="animation-duration:6.5s;animation-delay:-3.6s"/>
<rect x="526" y="330" width="8" height="8" fill="#ffffff" class="p" style="animation-duration:10.4s;animation-delay:-3.5s"/>
<rect x="94" y="330" width="5" height="5" fill="#22d3ee" class="p" style="animation-duration:9.1s;animation-delay:-2.0s"/>
<rect x="370" y="330" width="6" height="6" fill="#38bdf8" class="p" style="animation-duration:11.6s;animation-delay:-5.1s"/>
<rect x="704" y="330" width="5" height="5" fill="#93c5fd" class="p" style="animation-duration:10.6s;animation-delay:-6.9s"/>
<rect x="916" y="330" width="8" height="8" fill="#ffffff" class="p" style="animation-duration:8.0s;animation-delay:-4.2s"/>
<rect x="528" y="330" width="10" height="10" fill="#22d3ee" class="p" style="animation-duration:6.4s;animation-delay:-1.1s"/>
