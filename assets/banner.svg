<rect x="866" y="330" width="5" height="5" fill="#38bdf8" class="p" style="animation-duration:11.7s;animation-delay:-7.6s"/>
<rect x="616" y="330" width="5" height="5" fill="#93c5fd" class="p" style="animation-duration:9.5s;animation-delay:-4.8s"/>
