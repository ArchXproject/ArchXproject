</g>
<text x="500" y="158" text-anchor="middle" font-size="80" font-weight="800" letter-spacing="2" fill="url(#tg)" filter="url(#glow)" class="tt">ArchXproject</text>
<g font-size="22" font-weight="600" fill="#bfdbfe" text-anchor="middle">
<text class="sub" x="500" y="208" style="animation-delay:0s">Design. Build. Ship. Support.</text>
<text class="sub" x="500" y="208" style="animation-delay:3s">Store  •  Studio  •  Hotline  •  Support</text>
<text class="sub" x="500" y="208" style="animation-delay:6s">Chat with us on Telegram @xArchi</text>
</g>
