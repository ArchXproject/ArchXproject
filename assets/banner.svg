<g class="w2"><path d="M0 300 q125 -26 250 0 t250 0 t250 0 t250 0 t250 0 t250 0 V320 H0 Z" fill="#0b2a6b" opacity=".9"/></g>
<rect class="sw" x="0" y="0" width="120" height="320" fill="#fff" opacity=".07"/>
</g>
<rect x=".75" y=".75" width="998.5" height="318.5" rx="18" fill="none" stroke="#38bdf8" stroke-opacity=".45" stroke-width="1.5"/>
</svg>