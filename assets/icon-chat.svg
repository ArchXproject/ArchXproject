<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges"><style>.bob{animation:bob 1s steps(1) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}.fa{animation:fa 1s steps(1) infinite}@keyframes fa{0%{opacity:1}50%{opacity:0}}.fb{opacity:0;animation:fb 1s steps(1) infinite}@keyframes fb{0%{opacity:0}50%{opacity:1}}.mv{animation:mv 2s steps(1) infinite}@keyframes mv{0%{transform:translate(0,0)}50%{transform:translate(2px,1px)}}</style><g class="bob"><rect x="1" y="2" width="14" height="10" fill="#0a1030"/><rect x="2" y="3" width="12" height="8" fill="#ffffff"/><rect x="3" y="12" width="3" height="2" fill="#0a1030"/><rect x="3" y="11" width="2" height="2" fill="#ffffff"/><rect x="4" y="6" width="2" height="2" fill="#1d63d8" class="bl"/><rect x="7" y="6" width="2" height="2" fill="#1d63d8" class="bl" style="animation-delay:0.2s"/><rect x="10" y="6" width="2" height="2" fill="#1d63d8" class="bl" style="animation-delay:0.4s"/></g></svg>