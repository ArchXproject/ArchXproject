<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges"><style>.bob{animation:bob 1s steps(1) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}.fa{animation:fa 1s steps(1) infinite}@keyframes fa{0%{opacity:1}50%{opacity:0}}.fb{opacity:0;animation:fb 1s steps(1) infinite}@keyframes fb{0%{opacity:0}50%{opacity:1}}.mv{animation:mv 2s steps(1) infinite}@keyframes mv{0%{transform:translate(0,0)}50%{transform:translate(2px,1px)}}</style><rect x="2" y="2" width="12" height="14" fill="#0a1030"/><rect x="3" y="3" width="10" height="12" fill="#ffffff"/><rect x="6" y="1" width="4" height="2" fill="#38bdf8"/><rect x="6" y="1" width="4" height="1" fill="#0a1030"/><g class="bl" style="animation-delay:0s"><rect x="4" y="5" width="1" height="1" fill="#4ade80"/><rect x="5" y="6" width="1" height="1" fill="#4ade80"/><rect x="6" y="5" width="1" height="1" fill="#4ade80"/><rect x="7" y="4" width="1" height="1" fill="#4ade80"/></g><rect x="9" y="5" width="3" height="1" fill="#94a3b8"/><g class="bl" style="animation-delay:0.33s"><rect x="4" y="9" width="1" height="1" fill="#4ade80"/><rect x="5" y="10" width="1" height="1" fill="#4ade80"/><rect x="6" y="9" width="1" height="1" fill="#4ade80"/><rect x="7" y="8" width="1" height="1" fill="#4ade80"/></g><rect x="9" y="9" width="3" height="1" fill="#94a3b8"/><g class="bl" style="animation-delay:0.66s"><rect x="4" y="13" width="1" height="1" fill="#4ade80"/><rect x="5" y="14" width="1" height="1" fill="#4ade80"/><rect x="6" y="13" width="1" height="1" fill="#4ade80"/><rect x="7" y="12" width="1" height="1" fill="#4ade80"/></g><rect x="9" y="13" width="3" height="1" fill="#94a3b8"/></svg>