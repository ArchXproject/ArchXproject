<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="64" height="64" shape-rendering="crispEdges"><style>.bob{animation:bob 1s steps(1) infinite}@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-1px)}}.bl{animation:bl 1s steps(1) infinite}@keyframes bl{0%{opacity:1}50%{opacity:0}}.fa{animation:fa 1s steps(1) infinite}@keyframes fa{0%{opacity:1}50%{opacity:0}}.fb{opacity:0;animation:fb 1s steps(1) infinite}@keyframes fb{0%{opacity:0}50%{opacity:1}}.mv{animation:mv 2s steps(1) infinite}@keyframes mv{0%{transform:translate(0,0)}50%{transform:translate(2px,1px)}}</style><rect x="1" y="2" width="14" height="10" fill="#0a1030"/><rect x="2" y="3" width="12" height="8" fill="#0b2a6b"/><rect x="3" y="4" width="4" height="3" fill="#38bdf8" class="bl"/><rect x="8" y="4" width="4" height="3" fill="#f472b6" class="bl" style="animation-delay:0.5s"/><rect x="3" y="8" width="9" height="2" fill="#fde047"/><rect x="6" y="12" width="4" height="1" fill="#0a1030"/><rect x="4" y="13" width="8" height="1" fill="#0a1030"/><g class="mv"><rect x="9" y="5" width="1" height="4" fill="#ffffff"/><rect x="10" y="6" width="1" height="1" fill="#ffffff"/><rect x="10" y="7" width="1" height="1" fill="#ffffff"/><rect x="11" y="8" width="1" height="1" fill="#ffffff"/></g></svg>